[project]
name = "ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aryan Kumar", email = "kumararyan1929@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "google-genai>=2.30.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai = "ai:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
