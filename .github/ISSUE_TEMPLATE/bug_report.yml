name: Bug report
description: Report something that is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first to
        avoid duplicates.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact steps someone else can follow to see the problem.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error output or screenshots if you have them.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - apps/api (backend)
        - apps/web (frontend)
        - services/ai (AI service)
        - Database or migrations
        - Documentation
        - Build, tooling, or CI
        - Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, browser, and anything else relevant.
      placeholder: |
        OS: Windows 11
        Node.js: 24.19.0
        Browser: Chrome 140
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I have not included any secrets, tokens, or personal data in this report.
          required: true
