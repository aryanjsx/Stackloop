name: Feature request
description: Suggest an idea or improvement for StackLoop
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        StackLoop is delivered in sequential phases. Please check the
        [Phase Tracker](../../docs/phase-tracker.md) and the [PRD](../../docs/prd.md) first —
        your idea may already be planned for a later phase, or deliberately out of MVP scope.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem rather than jumping to a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Why is this valuable?
      description: Who benefits, and how does it fit StackLoop's goals?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I checked the PRD and this is not listed as explicitly out of MVP scope.
          required: true
