name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'rebuild/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stackloop_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @stackloop/api prisma:generate

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Lint
        run: pnpm lint

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stackloop_test?schema=public
          JWT_SECRET: test-jwt-secret-min-32-chars-length-required-12345
          GITHUB_CLIENT_ID: dummy-client-id
          GITHUB_CLIENT_SECRET: dummy-client-secret
          GITHUB_REDIRECT_URI: http://localhost:4000/auth/github/callback
          FRONTEND_ORIGIN: http://localhost:3000
        run: pnpm test

      - name: Run Build
        run: pnpm build
